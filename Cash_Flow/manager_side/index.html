  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    // 7/22/2025 - Navigation bar/Switching panels

    // panel switching 
    let mainContents = document.querySelector(".main-contents");

    // nav-bar 
    let customerId = document.getElementById("customer-id");
    let cashflowId = document.getElementById("cashflow-id");
    let chatId = document.getElementById("chat-id");

    // panels 
    let customerPanel = document.getElementById("customer"); // append the customer data
    let cashflowPanel = document.getElementById("cashflow");
    let chatPanel = document.getElementById("chat");

    mainContents.addEventListener("click", function(event) {
      let action = event.target.id;

      // navigating through the main contents
      if(action === "customer-id") {
        customerId.style.backgroundColor = "grey";
        customerPanel.style.display = "flex";

        cashflowId.style.backgroundColor = "";
        cashflowPanel.style.display = "none";

        chatId.style.backgroundColor = "";
        chatPanel.style.display = "none";
      } else if (action === "cashflow-id") {
        cashflowId.style.backgroundColor = "grey";
        cashflowPanel.style.display = "flex";

        customerId.style.backgroundColor = "";
        customerPanel.style.display = "none";

        chatId.style.backgroundColor = "";
        chatPanel.style.display = "none"
      } else if (action === "chat-id") {
        chatId.style.backgroundColor = "grey";
        chatPanel.style.display = "flex";

        cashflowId.style.backgroundColor = "";
        cashflowPanel.style.display = "none";

        customerId.style.backgroundColor = "";
        customerPanel.style.display = "none"
      }

     })

    // making the progress panel dynamic
    let deadline = document.querySelector(".deadlines"); // append the dueDisplay

    let ordersCache = [];

    // token
    const token = localStorage.getItem("token");

    if (!token) {
        alert("You are not logged in!");
        window.location.href = "/"; // Change this to your actual login file path
    }

    displayData();

    function displayData() {
      fetch("https://project-s-nhsi.onrender.com/project/viewallorders", {
        headers: {
          Authorization: `Bearer ${token}`
        }
      })
        .then(res => res.json())
        .then(data => {
          ordersCache = data;
          displayer(ordersCache);
        });
    }

    customerPanel.addEventListener("click", handleCustomerClick);
    deadline.addEventListener("click", handleCustomerClick);

                // ==== MODALS ==== //
    // customer modal popup
    let customerModal = document.getElementById("customer-modal")

    // confirmation modal
    let confirmModal = document.getElementById("confirmation");

    // add customer form
    let addCustomerForm = document.getElementById("add-customer-form");

    function displayer(obj){  
      customerPanel.innerHTML = "";   // 🔥 ADD THIS

      obj.forEach(o => {

      let orderContain = document.createElement("div");
      orderContain.className = "customer-name-order";

      orderContain.dataset.id = o.order_id;

      let customerInfo = document.createElement("h3");
      customerInfo.className = "customer-info";
      customerInfo.textContent = `${o.full_name}`;

      let progressTrack = document.createElement("div");
      progressTrack.className = "progress-track";
      customerInfo.textContent = `${o.full_name}`;

      let progressDisplay = document.createElement("div");
      progressDisplay.className = "progress-display";
      progressDisplay.textContent = `${o.status}`;

      orderContain.appendChild(customerInfo); 
      progressTrack.appendChild(progressDisplay);
      orderContain.appendChild(progressTrack)
      customerPanel.appendChild(orderContain);

      let dueDateDisplay = document.createElement("div");
      dueDateDisplay.className = "due-display";

      let dueWrapper = document.createElement("div");
      dueWrapper.className = "due-wrapper"; 

      let orderDate = new Date(o.created_at);

      let deadlineDate = new Date(orderDate);
      deadlineDate.setDate(orderDate.getDate() + 7);

      let today = new Date();

      let timeDiff = deadlineDate - today;

      let dayDiff = Math.ceil(timeDiff / (1000*60*60*24));

      if(dayDiff <= 3 && dayDiff >= 0) {

        let daysLabel = document.createElement("span");

        const clone = orderContain.cloneNode(true);

        daysLabel.style.fontSize = "12px";
        daysLabel.style.color = "red";
        daysLabel.style.marginLeft = "10px";

        if(dayDiff === 0) {
          daysLabel.textContent = `Due Today`;
        } else {
          daysLabel.textContent = `Due in ${dayDiff} days`;
        }

        if(o.status === "ready" || o.status === "released") {
          daysLabel.style.color = "#32CD32";
          daysLabel.textContent = "Completed";
        }

        clone.querySelector(".customer-info").appendChild(daysLabel);

        dueWrapper.appendChild(clone);
        dueDateDisplay.appendChild(dueWrapper);
        deadline.appendChild(dueDateDisplay);
      } 
    });
    } // function closing

    document.querySelector(".submit-save").addEventListener("click", () => {
      customerModal.style.display = "none";
     });

    function openCustomerModal(o) {
      customerModal.style.display = "flex";

      let progressBar = document.querySelector(".progress-bar");
      progressBarLogic(o.status, progressBar)

      // customer modal (left-side upper)
      let leftInfo = document.querySelector(".left-info");
      leftInfo.innerHTML = "";

      let customerName = document.createElement("h2");
      customerName.className = "customer-name";
      customerName.textContent = `${o.order_name}`
     
      let customerCredentials = document.createElement("p");
      customerCredentials.className = "customer-credentials";
      customerCredentials.textContent = `${o.phone_number}`;

      let customerEmail = document.createElement("p");
      customerEmail.className = "customer-credentials";
      customerEmail.textContent = `${o.email}`;
     
      leftInfo.appendChild(customerName);
      leftInfo.appendChild(customerCredentials);
      leftInfo.appendChild(customerEmail);

      // right-side upper
      let rightInfo = document.querySelector(".right-info");
      rightInfo.innerHTML = "";

      let convertToDate = new Date(o.created_at);
      let month = convertToDate.getMonth() + 1; 
      let day = convertToDate.getDate();
      let year = convertToDate.getFullYear();

      const formatDate = `${month}/${day}/${year}`;

      let dateOrdered = document.createElement("h2");
      dateOrdered.className = "date-ordered";
      dateOrdered.textContent = "Ordered In:";

      let date = document.createElement("p");
      date.className = "date";
      date.textContent = formatDate;
        
      rightInfo.appendChild(dateOrdered);
      rightInfo.appendChild(date);

      // middle info (right)
      let setWrapper = document.querySelector(".set-wrapper");
      setWrapper.innerHTML = "";

      let orderLabel = document.createElement("h2")
      orderLabel.className = "order-label";
      orderLabel.textContent = `${o.sets} set`;

      setWrapper.appendChild(orderLabel);

      const progressTrack = customerModal.querySelector(".progress-track");
      const progressDisplay = customerModal.querySelector(".progress-display");

      dropdown(o, progressTrack, progressDisplay, progressBar);

    }

    function handleCustomerClick(e) {
      const card = e.target.closest(".customer-name-order");

      if(!card) return;

      const orderId = Number(card.dataset.id);
      const order = ordersCache.find(o => o.order_id === orderId);
      if(!order) return;

      openCustomerModal(order);
    }

    function dropdown(orders, progressTrk, progressDisp, progressBar) {
      // dropdown order-type logic
     let orderDropdown = document.querySelector(".order-type");
     let remarksVal = document.getElementById("requests");
     remarksVal.textContent = orders.remarks || "No Remarks";

     let newOrderDropdown = orderDropdown.cloneNode(true);

     newOrderDropdown.selectedIndex = 0;

     if(orders.order_name) {
      let normalizedType = orders.order_name.toLowerCase().trim().replace(/ /g, "_");
      newOrderDropdown.value = normalizedType;
     }

      orderDropdown.replaceWith(newOrderDropdown);

     document.querySelector(".grid-box-one").innerHTML = "";
     document.querySelector(".grid-box-two").innerHTML = "";

     const updateMeasurementDisplay = () => {

      console.log("Fetching measurements for Order ID:", orders.order_id);
      console.log("Using Token:", token);

      fetch(`https://project-s-nhsi.onrender.com/project/orders/${orders.order_id}/measurements`, {
        headers: {
          Authorization: `Bearer ${token}`
        }
      })
        .then(res => {
          if(!res.ok) {
            throw new Error(`Server returned ${res.status}: ${res.statusText}`);
          }
          return res.json();
        })
        .then(measurements => {
          console.log("MEASUREMENTS:", measurements);

          if (!measurements || Object.keys(measurements).length === 0) return;
          renderMeasurements(measurements);
        })
          .catch(error => {
              console.error("Error fetching measurements:", error);
        });
     }

     updateMeasurementDisplay()

      newOrderDropdown.addEventListener("change", function() {
        updateMeasurementDisplay(this.value);
      });

      let statusDropdown = document.getElementById("status-dropdown");

      let newStatusDropdown = statusDropdown.cloneNode(true);
      statusDropdown.replaceWith(newStatusDropdown);
      statusDropdown = newStatusDropdown;

      statusDropdown.value = orders.status;

      let currentStatus = orders.status;
      let pendingStatus = null;

    const confirmExit = function() {
       confirmModal.style.display = "flex";
    }

    statusDropdown.addEventListener("change", function(e) {
      pendingStatus = e.target.value;

      confirmModal.style.display = "flex";

      setUpConfirmationModal(orders, pendingStatus, currentStatus);
    })
    }

    function setUpConfirmationModal(o, pStatus, cStatus) {
       const noBtn = document.querySelector(".no");
       const yesBtn = document.querySelector(".confirm-modal");

       noBtn.replaceWith(noBtn.cloneNode(true));
       yesBtn.replaceWith(yesBtn.cloneNode(true));

       const newNo = document.querySelector(".no");
       const newYes = document.querySelector(".confirm-modal");

       newNo.addEventListener("click", () => {
        confirmModal.style.display = "none";
        dropdown.value = currentStatus;
        pendingStatus = null;
       });

      newYes.addEventListener("click", () => {

        fetch(`https://project-s-nhsi.onrender.com/project/updateorders/${o.order_id}/status`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({
            status: pStatus
          })
        })
        .then(res => {
          if (!res.ok) return res.json().then(err => { throw new Error(err.message || "Update failed") });
          return res.json();
        })
        .then(data => {
          console.log(data);

          o.status = pStatus;
          cStatus = pStatus;

          progressBarLogic(orders.status, progressBar);
          if(progressTrk && progressDisp) {
            progressTrk.innerHTML = ""
            progressDisp.textContent = `${pendingStatus}`;
            progressTrk.appendChild(progressDisp);
          }

          alert("Status updated successfully");
          confirmModal.style.display = "none";
        })
        .catch(error => {
          console.error("Error updating status:", error);
          confirmModal.style.display = "none";
        });
       })
    }

    function renderMeasurements(measurements) {
      let gridOne = document.querySelector(".grid-box-one");
      let gridTwo = document.querySelector(".grid-box-two");

      gridOne.innerHTML = "";
      gridTwo.innerHTML = "";

      const { id, order_id, created_at, updated_at, type, ...measurementFields } = measurements;

      const entries = Object.entries(measurementFields);

      entries.forEach(([key, value], index) => {
        // Skip null or empty values if you don't want to show them
        if (value === null || value === "") return;

        const formattedKey = key.split('_').map(word => 
          word.charAt(0).toUpperCase() + word.slice(1)
        ).join(' ');
        const measurementElement = document.createElement('div');
        measurementElement.className = 'measurement-item';
        measurementElement.innerHTML = `
          <span class="measurement-label">${formattedKey}:</span>
          <span class="measurement-value">${value}</span>
        `;
        if (index % 2 === 0) {
          gridOne.appendChild(measurementElement);
        } else {
          gridTwo.appendChild(measurementElement);
        }
      });
    }

    function progressBarLogic(status, barElement) {
      let percentText = document.createElement("p");
      percentText.className = "percent-text";
      let percentage = 0;
      if(status === "pending") {
        percentage = 0;
      } else if(status === "measuring") {
        percentage = 10;
      } else if (status === "sewing") {
        percentage = 50;
      } else if (status === "ready") {
        percentage = 100;
      } else if (status === "released") {
        percentage = 100;
      }
      barElement.style.width = percentage + "%";
      percentText.textContent = `${percentage}%`;
      barElement.innerHTML = "";
      barElement.appendChild(percentText);
    }
  
            // ===== CASH FLOW FUNCTIONS ===== //
     let tablePosition = document.querySelector(".table-position"); // parent 
     let initialTotal = document.getElementById("initial-state"); // initial
     let finalTotal = document.getElementById("total-val"); // final
     let tableBody = document.querySelector("tbody");
     let addBtn = document.querySelector(".add-rows");

     let date = document.getElementById("date");
     let description = document.getElementById("description");
     let ins = document.querySelector('[data-type="in"]');
     let outs = document.querySelector('[data-type="out"]');
     let output = document.querySelector('[data-type="output"]');

     loadCashflowData();

     function loadCashflowData() {
      fetch("https://project-s-nhsi.onrender.com/project/viewcashflow", {
        headers: { Authorization: `Bearer ${token}` }
      })
        .then(res => res.json())
        .then(rows => {
          tableBody.innerHTML = "";

          if (!Array.isArray(rows)) {
            console.error("Data is not an array:", rows);
            addRow(); // Fail-safe: Add blank row
            return;
        }

        if(rows.length > 0 && rows[0].initial_val) {
          initialTotal.value = rows[0].initial_val;
        }

          let runningBalance = Number(initialTotal.value) || 0;

          rows.forEach(row => {
            let valIn = Number(row.amount_in) || 0;
            let valOut = Number(row.amount_out) || 0; 

            runningBalance += valIn - valOut;

            addRow({
              date: row.entry_date,
              desc: row.description,
              in: row.amount_in,
              out: row.amount_out,
              output: runningBalance
            })
          })

          finalTotal.textContent = runningBalance;

          addRow();
        })
          .catch(err => {
            console.error(err);
            addRow();
          });
     }

     tablePosition.addEventListener("input", function(event) {

      let prevOutput = Number(initialTotal.value); // this will be the initial output

      // this is for the added rows
      let newlyRows = document.querySelectorAll("tbody tr");

     function renderMeasurementFields(container1, container2, template, prefix) {
        container1.innerHTML = "";
        container2.innerHTML = "";

        let keys = Object.keys(template);

        for(let i = 0; i < keys.length; i++) {
          let keysVal = keys[i];

          let wrapper = document.createElement("div");
          wrapper.className = "input-group";

          let input = document.createElement("input");
          input.type = "text";
          input.className = "add-size-input";
          input.placeholder = keysVal,
          input.value = template[keysVal],
          input.setAttribute("data-key", `${prefix}|${keysVal}`);

          wrapper.appendChild(input);

          if(i % 2 === 0) {
            container1.appendChild(wrapper);
          } else {
            container2.appendChild(wrapper);
          } 
        }
     }

    function formattedDate(now) {

      if(!(now instanceof Date)) now = new Date(now);
      if(isNaN(now)) now = new Date();

      let hrs = now.getHours();
      let mins = now.getMinutes();
      let ampm = hrs >= 12 ? "PM" : "AM";

      hrs = hrs % 12;
      hrs = hrs ? hrs : 12;

      mins = mins < 10 ? "0" + mins : mins;

      let month = now.getMonth() + 1;
      let day = now.getDate();
      let year = now.getFullYear();

      return `${hrs}:${mins} ${ampm} ${month}/${day}/${year}`;    
    }

    function loadChatHistory(customerId) {
      fetch(`https://project-s-nhsi.onrender.com/project/loadchats/${customerId}`,{
        headers: { Authorization: `Bearer ${token}` }
      })
        .then(res => res.json())
        .then(data => {
          const container = document.querySelector(".chat-messages");
          container.innerHTML = "";

          let messages = [];

          if(Array.isArray(data)) {
            messages = data;
          } else if (data.data && Array.isArray(data.data)) {
            messages = data.data;
          }

          if(messages.length === 0) {
            console.log("No messages found");
          }

          messages.forEach(msg => {
            let dateVal = msg.created_at ? new Date(msg.created_at) : new Date();
            renderMessage(msg.message, msg.sender, dateVal);
          });

          container.scrollTop = container.scrollHeight;
        })
          .catch(err => console.log(err));
    }

     function renderMessage(text, sender, date) {
      const chatMessages = document.querySelector(".chat-messages");

      const messageWrap = document.createElement("div");
      messageWrap.className = `message-wrap ${sender}`;

      const messageBubble = document.createElement("div");
      messageBubble.className = "message-bubble";
      messageBubble.textContent = text;

      const dateElement = document.createElement("p");
      dateElement.className = "message-date";
      dateElement.textContent = formattedDate(date);
      dateElement.style.display = "none";

      messageBubble.addEventListener("mouseover", () => dateElement.style.display = "block");
      messageBubble.addEventListener("mouseout", () => dateElement.style.display = "none");

      messageWrap.append(dateElement);
      messageWrap.append(messageBubble);
      chatMessages.appendChild(messageWrap);
    }
